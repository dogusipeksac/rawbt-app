<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Yazıcı Entegrasyonu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .receipt-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #dee2e6;
        }

        .receipt-id {
            font-size: 18px;
            font-weight: bold;
            color: #495057;
        }

        .receipt-amount {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }

        .receipt-items {
            margin: 15px 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: #495057;
        }

        .item-price {
            color: #6c757d;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .merchant-info {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .merchant-name {
            font-size: 20px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        .merchant-details {
            font-size: 14px;
            color: #6c757d;
        }

        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖨️ POS Yazıcı Sistemi</h1>
            <p>Web'den Mobil Uygulamaya Fiş Yazdırma</p>
        </div>

        <div class="content">
            <div class="merchant-info">
                <div class="merchant-name">ABC Market</div>
                <div class="merchant-details">Atatürk Cad. No:123, İstanbul<br>Tel: 0212 123 45 67</div>
            </div>

            <div class="receipt-card">
                <div class="receipt-header">
                    <div class="receipt-id">Fiş #2024-001</div>
                    <div class="receipt-amount">₺159.50</div>
                </div>

                <div class="receipt-items">
                    <div class="item">
                        <span class="item-name">Ekmek (2 adet)</span>
                        <span class="item-price">₺10.00</span>
                    </div>
                    <div class="item">
                        <span class="item-name">Süt (1 adet)</span>
                        <span class="item-price">₺25.50</span>
                    </div>
                    <div class="item">
                        <span class="item-name">Peynir (1 kg)</span>
                        <span class="item-price">₺124.00</span>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="printReceipt()">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                        </svg>
                        Yazdır (Mobil)
                    </button>
                    <button class="btn btn-secondary" onclick="printWeb()">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        Yazdır (Web)
                    </button>
                </div>
            </div>

            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script src="pos-printer-bridge.js"></script>
    <script>
        function printReceipt() {
            const receiptData = {
                receiptId: "2024-001",
                timestamp: new Date().toISOString(),
                merchant: {
                    name: "ABC Market",
                    address: "Atatürk Cad. No:123",
                    city: "İstanbul",
                    phone: "0212 123 45 67",
                    taxNumber: "1234567890"
                },
                items: [
                    {
                        name: "Ekmek",
                        quantity: 2,
                        unitPrice: 5.00,
                        totalPrice: 10.00
                    },
                    {
                        name: "Süt",
                        quantity: 1,
                        unitPrice: 25.50,
                        totalPrice: 25.50
                    },
                    {
                        name: "Peynir",
                        quantity: 1,
                        unitPrice: 124.00,
                        totalPrice: 124.00
                    }
                ],
                subtotal: 159.50,
                tax: 28.71,
                taxRate: 18,
                totalAmount: 188.21,
                paymentMethod: "Nakit",
                currency: "TRY"
            };

            POSPrinterBridge.print(receiptData);
        }

        function printWeb() {
            window.print();
        }
    </script>
</body>
</html>
